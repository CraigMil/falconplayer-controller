- name: ESPN College Football
  sport: ncaaf
  label: NCAAF
  channel_id: UCzRWWsFjqHk1an4OnVPsl9g
  patterns: ["Highlights"]
# NBC Sports is MULTI-SPORT: it posts college football and golf alongside the
# Premier League, so a bare "Highlights" pattern mislabelled a San Jose State
# game as EPL. Narrow the pattern to the sport we want from this channel.
- name: NBC Sports
  sport: epl
  label: EPL
  channel_id: UCqZQlzSHbVJrwrn5XvzrzcA
  patterns: ["Premier League"]
- name: CBS Sports Golazo
  sport: cup
  label: SOCCER
  channel_id: UCET00YnetHT7tOpu12v8jxg
  patterns: ["Highlights", "Extended Highlights"]
