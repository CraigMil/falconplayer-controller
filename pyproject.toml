[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falconplayer-controller"
version = "0.1.0"
description = "CLI and Prometheus exporter for Falcon Player FPP"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "prometheus-client>=0.20",
]

[project.scripts]
fpp = "fpp.cli:main"
fpp-exporter = "fpp.exporter:main"

[tool.hatch.envs.default]
dependencies = [
    "ruff",
    "pytest",
    "pytest-httpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/fpp"]

[tool.ruff.lint]
select = ["E", "F", "I"]
